[package]
name = "robogen-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "x11"] }
# Keep eframe's floating transitive ranges compatible with workspace MSRV 1.85.
image = { version = "=0.25.5", default-features = false, features = ["png"] }
idna = "=1.0.3"
idna_adapter = "=1.2.0"
robogen-telemetry = { path = "../../crates/robogen-telemetry" }
robogen-export = { path = "../../crates/robogen-export" }
robogen-ui = { path = "../../crates/robogen-ui" }
tracing = { workspace = true }
url = "=2.5.4"
wayland-protocols = "=0.32.7"

[lints]
workspace = true
